 // GEISA Communications Status

syntax = "proto3";

enum GeisaConnState {
	// Communication path is not available to the application.
	CONN_DISABLED = 0;
	// Communication path is enabled by policy but not currently usable.
	CONN_ENABLED_DOWN = 1;
	// Communication path is enabled by policy and currently usable.
	CONN_ENABLED_UP = 2;
}

message GeisaConnInfo {
	// High-level connection visibility for message, operator, internet, or local
	// transport paths
	GeisaConnState state = 1;
	// IPv4 availability for the path; true when IPv4 is usable
	bool ipv4 = 2;
	// IPv6 availability for the path; true when IPv6 is usable.
	bool ipv6 = 3;
	// True indicates real-time or near-real-time connectivity
	// False indicates delayed, intermittent, or otherwise non-real-time handling
	bool realtime = 4;
}

message GeisaConnAppMsg {
	// Message-count accounting for app-message communication
	// Byte/bandwidth accounting is handled separately in GeisaConnAppInfo
	// Previous-day message usage
	uint32 yesterday_used = 1;
	// Current-day message usage
	uint32 today_used = 2;
	// Current-day message limit
	uint32 today_limit = 3;
	// Remaining messages in the current daily window
	uint32 today_remaining = 4;
	// UTC epoch time in milliseconds for the next daily reset
	uint64 next_daily_reset_ms = 5;
}

enum GeisaConnPolicy {
	// No usable allocation is currently available for this communication class
	CONN_POLICY_ZERO = 0;
	// Communication is allowed subject to metered byte-volume accounting / quotas
	CONN_POLICY_METERED = 1;
	// Communication is allowed without an app-visible limit
	CONN_POLICY_UNLIMITED = 2;
}

message GeisaConnAppInfo {
	// Current app-visible policy state for this class
	GeisaConnPolicy policy = 1;
	// Previous-day application payload bytes used while policy was unlimited
	uint64 yesterday_used_unlimited = 10;
	// Previous-day application payload bytes used while policy was metered
	uint64 yesterday_used_metered = 11;
	// Current-day application payload bytes used while policy is unlimited
	uint64 today_used_unlimited = 12;
	// Current-day application payload bytes used while policy is metered
	uint64 today_used_metered = 13;
	// Current-day metered application payload byte limit
	uint64 today_limit_metered = 14;
	// Remaining metered application payload bytes for the current daily window.
	// If this reaches zero, policy remains CONN_POLICY_METERED until reset or
	// operator adjustment; exhaustion does not imply CONN_POLICY_ZERO.
	uint64 today_remaining_metered = 15;
	// UTC epoch time in milliseconds for the next daily reset of this volume
	// accounting class.
	uint64 next_daily_reset_ms = 16;
}

enum GeisaPlatformMode {
	PLATFORM_MODE_NORMAL = 0;
	PLATFORM_MODE_UNPROVISIONED = 10;
	PLATFORM_MODE_MANUFACTURING = 20;
	PLATFORM_MODE_TEST = 30;
}

enum GeisaAppToPlatformStatusType {
	RUNNING = 0;
	// set to ack cmd_clear_pii
	CLEARED_PII = 2;
	// set on receipt of cmd_shut_down
	SHUTTING_DOWN = 3;
	// Request from an application to terminate itself and restart
	NEED_TERMINATE_RESTART = 4;
	// Request from an. application to terminate itself and do NOT restart it
	NEED_TERMINATE_NORESTART = 5;
}


// This is the most outer message for Platform Status
// Message topic: geisa/api/platform/status
message GeisaPlatformStatus {
	// UTC epoch time in milliseconds when this broadcast status message was
	// generated by the platform
	uint64 timestamp_ms = 1000;
	// Platform mode plus the visibility of message, operator, internet, and
	// local transport state
	GeisaPlatformMode mode = 10;
	GeisaConnState conn_msg = 20;
	GeisaConnInfo conn_oper = 21;
	GeisaConnInfo conn_inet = 22;
	GeisaConnInfo conn_local = 23;
	bool sys_over_temp = 30;
	bool sys_high_cpu = 31;
	bool sys_low_mem = 32;
	bool sys_power_degraded = 33;
	bool sys_power_loss = 34;
	bool sys_reboot_soon = 35;
	bool sys_shutdown_soon = 36;
}

// This is the most outer message for Platform To App Status
// Message topic: geisa/api/platform/app/status/<userid>
message GeisaPlatformToAppStatus {
	// Platform commands for app-side status/reporting behavior
	bool cmd_send_status = 1;           // App should send a GeisaAppToPlatformStatus immediately
	bool cmd_shut_down = 2;             // transition to SHUTTING_DOWN
	bool cmd_clear_pii = 3;             // once done send CLEARED_PII
	uint64 timestamp_ms = 1000;			// UTC epoch time in milliseconds when this message was *generated* by the platform
	// percentage (0-100)
	float cpu_usage = 10;
	float cpu_limit = 11;
	// in bytes
	uint32 memory_usage = 12;
	uint32 memory_limit = 13;
	uint32 persist_storage_usage = 14;
	uint32 persist_storage_limit = 15;
	uint32 nonpersist_storage_usage = 16;
	uint32 nonpersist_storage_limit = 17;

	GeisaConnAppMsg conn_msg = 20;
	GeisaConnAppInfo conn_oper = 21;
	GeisaConnAppInfo conn_inet = 22;
	GeisaConnAppInfo conn_local = 23;
}

// This is the most outer message for App To Platform Status
// Message topic: geisa/api/app/platform/status/<userid>
message GeisaAppToPlatformStatus {
	// App-side status sent back to the platform.
	GeisaAppToPlatformStatusType type = 1;
	int32 next_status = 10;              // How long until App will send next status
	int32 next_status_timeout = 11;      // Timeout platform should use (recommended 2.5x next_status)
}
